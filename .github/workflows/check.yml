name: check-manga
run-name: ${{ github.event_name == 'schedule' && 'รอบสำรอง (GitHub)' || inputs.auto == '1' && 'อัตโนมัติ (Cloudflare)' || inputs.test_series != '' && 'ทดสอบเรื่อง' || inputs.test != '' && 'ทดสอบ Discord' || inputs.resend != '' && 'ส่งซ้ำ' || inputs.only != '' && 'ตรวจเรื่องเดียว' || 'ตรวจทุกเรื่อง' }}
on:
  schedule:
    - cron: "7,37 * * * *"   # รอบสำรองทุก ~30 นาที (รอบหลัก: Cloudflare สั่งทุก 5 นาทีเมื่อมีเรื่องถึงเวลา)
  workflow_dispatch:          # หน้าเว็บ/Cloudflare สั่งรัน
    inputs:
      only:
        description: "ตรวจเฉพาะเรื่องที่มี id นี้ (เว้นว่าง = ตรวจทุกเรื่องทันที)"
        required: false
        default: ""
      test:
        description: "ใส่ 1 เพื่อส่งข้อความทดสอบเข้า Discord"
        required: false
        default: ""
      resend:
        description: "id ของข้อความในบันทึกที่จะส่งซ้ำ"
        required: false
        default: ""
      test_series:
        description: "id ของเรื่องที่จะตรวจแล้วส่งข้อความทดสอบ"
        required: false
        default: ""
      auto:
        description: "1 = รอบอัตโนมัติจาก Cloudflare (ตรวจเฉพาะเรื่องที่ถึงเวลา)"
        required: false
        default: ""
      alert:
        description: "แจ้งเตือนระบบจาก Cloudflare"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: check-manga
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Load state (branch data)
        run: |
          mkdir -p /tmp/prev
          [ -f state.json ] && cp state.json state_main.json   # สำรองสถานะจาก main (ใช้กู้เรื่องที่ไม่มีใน branch data)
          if git fetch --depth=1 origin data 2>/dev/null; then
            for f in state.json notify_log.json public_log.json; do
              if git show origin/data:$f > /tmp/prev/$f 2>/dev/null; then cp /tmp/prev/$f $f; else rm -f /tmp/prev/$f; fi
            done
          else
            echo "ยังไม่มี branch data — ใช้ไฟล์ใน main เป็นค่าเริ่มต้น"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check updates
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ONLY: ${{ inputs.only }}
          TEST: ${{ inputs.test }}
          RESEND: ${{ inputs.resend }}
          TEST_SERIES: ${{ inputs.test_series }}
          AUTO: ${{ inputs.auto }}
          ALERT: ${{ inputs.alert }}
          EVENT: ${{ github.event_name }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.auto != '1' && '1' || '' }}
        run: python check.py
      - name: Save state (branch data)
        if: always()
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          changed=0
          for f in state.json notify_log.json public_log.json; do
            [ -f "$f" ] || continue
            cmp -s "$f" "/tmp/prev/$f" || changed=1
          done
          if [ "$changed" = 0 ]; then echo "ไม่มีอะไรเปลี่ยน"; exit 0; fi
          rm -rf /tmp/out && mkdir /tmp/out
          for f in state.json notify_log.json public_log.json; do [ -f "$f" ] && cp "$f" /tmp/out/; done
          cd /tmp/out
          git init -q -b data
          git config user.name "manga-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -qm "state $(date -u +%FT%TZ)"
          # เก็บแค่ commit เดียว (เขียนทับทุกรอบ): repo ไม่โตเรื่อย ๆ และหน้าเว็บไม่ต้อง build ใหม่ทุกรอบ
          git push -qf "https://x-access-token:${TOKEN}@github.com/${REPO}.git" data
