name: check-manga
on:
  schedule:
    - cron: "*/15 * * * *"   # รอบรันทุก 15 นาที แต่แต่ละเรื่องจะถูกตรวจทุก 30 นาที (ปรับได้ใน check.py)
  workflow_dispatch:          # กดรันเองจากหน้าเว็บจัดการได้
permissions:
  contents: write
concurrency:
  group: check-manga
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check updates
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check.py
      - name: Save state
        run: |
          git config user.name "manga-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase && git push)
