<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Manga Watch</title>
<meta name="description" content="ติดตามการ์ตูนตอนใหม่ พร้อมแจ้งเตือน Discord">
<meta name="theme-color" content="#5865f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f4f9;--bg2:#e9ebf3;--card:#fff;--tx:#191c27;--mut:#687087;--line:#e1e4ee;
  --pri:#5865f2;--pri2:#4752c4;--priS:#5865f21f;--ok:#1f9d57;--okS:#1f9d571f;--bad:#e5484d;--badS:#e5484d1a;--warn:#d98a1c;--warnS:#d98a1c1f;
  --sh:0 1px 2px #14182808,0 8px 24px #1418280d;--r:16px;--nav:64px
}
:root[data-theme=dark]{color-scheme:dark;--bg:#111318;--bg2:#181b22;--card:#1c1f27;--tx:#eceef4;--mut:#99a1b3;--line:#2a2f3b;--sh:0 1px 2px #0005,0 8px 24px #0004}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#111318;--bg2:#181b22;--card:#1c1f27;--tx:#eceef4;--mut:#99a1b3;--line:#2a2f3b;--sh:0 1px 2px #0005,0 8px 24px #0004}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--tx);font:15.5px/1.55 "IBM Plex Sans Thai",system-ui,-apple-system,"Noto Sans Thai","Segoe UI",sans-serif;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
a{color:var(--pri)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
.hide{display:none!important}
.mut{color:var(--mut)}.small{font-size:13px}.b{font-weight:700}

/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:10px;height:58px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;letter-spacing:-.2px;flex:1;min-width:0}
.logo img{width:30px;height:30px}
.logo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.health{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 11px;font-size:13px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mut);flex:none}
.dot.g{background:var(--ok);box-shadow:0 0 0 3px var(--okS)}.dot.y{background:var(--warn);box-shadow:0 0 0 3px var(--warnS)}.dot.r{background:var(--bad);box-shadow:0 0 0 3px var(--badS);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}
.me{display:inline-flex;align-items:center;gap:7px;border:0;background:var(--pri);color:#fff;border-radius:99px;padding:6px 13px;font-weight:600;font-size:14px;white-space:nowrap;max-width:46vw}
.me.in{background:var(--card);color:var(--tx);border:1px solid var(--line);padding:4px 11px 4px 4px}
.me .nmx{overflow:hidden;text-overflow:ellipsis}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.role{font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--bg2);color:var(--mut);white-space:nowrap}
.role.owner{background:#f0b23233;color:#b7791f}.role.mod{background:var(--priS);color:var(--pri)}

/* ---------- tabs ---------- */
nav.tabs{display:flex;gap:4px;padding:10px 0 4px}
.tab{border:0;background:transparent;color:var(--mut);padding:8px 14px;border-radius:11px;font-weight:600;display:inline-flex;align-items:center;gap:7px;position:relative;transition:background .15s,color .15s}
.tab:hover{background:var(--bg2)}
.tab[aria-selected=true]{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.tab .ic{font-size:17px}
.cnt{min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.cnt.soft{background:var(--bg2);color:var(--mut)}
@media(max-width:720px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;margin:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);justify-content:space-around;gap:0}
  .tab{flex-direction:column;gap:1px;font-size:11.5px;padding:5px 4px;flex:1;border-radius:10px}
  .tab[aria-selected=true]{box-shadow:none;background:var(--priS);color:var(--pri)}
  .tab .cnt{position:absolute;top:1px;right:calc(50% - 24px)}
  .health .txt,.me .role{display:none}
}
@media(min-width:721px){body{padding-bottom:30px}}

/* ---------- buttons ---------- */
.btn{border:0;border-radius:11px;padding:9px 15px;background:var(--pri);color:#fff;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;position:relative;transition:transform .12s,background .15s,opacity .15s;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--pri2)}
.btn:active{transform:scale(.94)}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--line);font-weight:500}
.btn.g:hover{background:var(--bg2)}
.btn.ok{background:var(--ok)}
.btn.t{background:transparent;color:var(--mut);padding:7px 9px}
.btn.t:hover{background:var(--bg2);color:var(--tx)}
.btn.sm{padding:6px 11px;font-size:13.5px;border-radius:9px}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad)!important;color:#fff!important;border-color:var(--bad)!important;animation:shake .3s}
.btn.on{background:var(--priS)!important;color:var(--pri)!important;border-color:transparent!important}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.busy{color:transparent!important;pointer-events:none}
.btn.busy::after{content:"";position:absolute;width:16px;height:16px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.btn.g.busy::after,.btn.t.busy::after{border-color:var(--line);border-top-color:var(--pri)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes pop{0%{opacity:0;transform:translateY(8px) scale(.98)}100%{opacity:1;transform:none}}
@keyframes shim{to{background-position:-200% 0}}

/* ---------- toolbar ---------- */
.bar{display:flex;gap:8px;align-items:center;margin:10px 0}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.search::before{content:"🔍";position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6}
.sel{padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:2px}
.seg button{border:0;background:transparent;padding:6px 10px;border-radius:9px;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--priS);color:var(--pri);font-weight:700}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;white-space:nowrap;font-size:13.5px;transition:transform .12s}
.chip:active{transform:scale(.94)}
.chip b{margin-left:5px;font-weight:700}
.chip[aria-pressed=true]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
@media(max-width:560px){.bar.lib{flex-wrap:wrap}.bar.lib .search{flex:1 1 100%}.bar.lib .sel{flex:1}}

/* ---------- continue strip ---------- */
.strip{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin}
.mini{flex:none;width:92px;border:0;background:none;padding:0;text-align:left;color:var(--tx)}
.mini .cvw{width:92px;height:128px;border-radius:12px;overflow:hidden;position:relative;box-shadow:var(--sh);transition:transform .15s}
.mini:hover .cvw{transform:translateY(-3px)}
.mini .n{font-size:12.5px;margin-top:5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ribbon{position:absolute;top:6px;left:6px;background:var(--bad);color:#fff;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:99px;box-shadow:0 2px 6px #0004}
h2.sec{font-size:15px;margin:16px 0 8px;display:flex;align-items:center;gap:8px}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.list{display:grid;gap:12px}
.s{display:grid;grid-template-columns:84px 1fr;gap:14px;padding:13px;animation:pop .3s both}
.s.off{opacity:.55}
.s.pending{outline:2px dashed var(--pri);outline-offset:-2px}
.cv{width:84px;height:118px;border-radius:11px;overflow:hidden;background:var(--bg2);border:0;padding:0;display:block;position:relative}
.cv img,.cvw img,.big img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:grid;place-items:center;font-size:30px;font-weight:800;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 62% 55%),hsl(calc(var(--h) + 45) 62% 38%))}
.nm{border:0;background:none;padding:0;font-weight:700;font-size:16.5px;text-align:left;color:var(--tx);overflow-wrap:anywhere;line-height:1.35}
.nm:hover{color:var(--pri)}
.r1{display:flex;gap:7px;align-items:flex-start;flex-wrap:wrap}
.pill{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.new{background:var(--bad);color:#fff}.pill.ok{background:var(--okS);color:var(--ok)}.pill.off{background:var(--bg2);color:var(--mut)}.pill.err{background:var(--badS);color:var(--bad);white-space:normal}.pill.pri{background:var(--priS);color:var(--pri)}
.meta{font-size:12.5px;color:var(--mut);margin-top:1px;overflow-wrap:anywhere}
.latest{margin-top:6px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
.latest .lb{font-size:13px;color:var(--mut)}
.latest b{font-size:22px;letter-spacing:-.5px;line-height:1}
.latest .t{color:var(--mut);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.chg{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--ok);background:var(--okS);padding:1px 8px;border-radius:7px;white-space:nowrap}
.prog{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin-top:6px}
.prog .barw{flex:1;max-width:180px;height:6px;border-radius:9px;background:var(--bg2);overflow:hidden}
.prog .barw i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .4s}
.prog.behind .barw i{background:var(--bad)}
.prog.behind>span:last-child{color:var(--bad);font-weight:700}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.err{color:var(--bad);font-size:12.5px;margin-top:6px;overflow-wrap:anywhere}
.sk{background:linear-gradient(90deg,var(--bg2) 25%,var(--card) 50%,var(--bg2) 75%) 0 0/200% 100%;animation:shim 1.2s linear infinite;border-radius:7px;height:13px;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.g1{border:0;background:none;padding:0;text-align:left;animation:pop .3s both;color:var(--tx)}
.g1 .cvw{aspect-ratio:5/7;border-radius:13px;overflow:hidden;position:relative;box-shadow:var(--sh);transition:transform .15s}
.g1:hover .cvw{transform:translateY(-3px)}
.g1 .n{font-weight:700;font-size:14px;margin-top:7px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.g1 .l{font-size:12.5px;color:var(--mut)}
.g1.off{opacity:.5}
.g1 .ch{position:absolute;left:0;right:0;bottom:0;padding:22px 8px 7px;background:linear-gradient(transparent,#000c);color:#fff;font-weight:800;font-size:15px}
.empty{text-align:center;color:var(--mut);padding:44px 16px}
.empty .big{font-size:44px;margin-bottom:6px}
@media(max-width:480px){.s{grid-template-columns:70px 1fr;gap:11px;padding:11px}.cv{width:70px;height:98px}.grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:11px}}

/* ---------- feed (discord-like) ---------- */
.day{font-size:12.5px;font-weight:700;color:var(--mut);margin:12px 10px 6px;display:flex;align-items:center;gap:10px}
.day::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{display:grid;grid-template-columns:40px 1fr;gap:12px;padding:10px 12px;border-radius:12px;animation:pop .3s both}
.msg:hover{background:var(--bg2)}
.bot{width:40px;height:40px;border-radius:50%;background:var(--pri);display:grid;place-items:center;font-size:20px}
.mh{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.mh .who{font-weight:700}.tagbot{font-size:10px;background:var(--pri);color:#fff;padding:1px 5px;border-radius:4px;font-weight:700}
.mention{background:var(--priS);color:var(--pri);border-radius:4px;padding:0 3px;font-weight:600}
.embed{margin-top:6px;border-left:4px solid var(--pri);background:var(--bg2);border-radius:6px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:12px;max-width:560px}
.embed .et{font-weight:700;color:var(--pri);text-decoration:none;overflow-wrap:anywhere}
.embed a.et:hover{text-decoration:underline}
.embed .ed{font-size:14px;margin-top:4px;overflow-wrap:anywhere}
.embed .ef{font-size:12px;color:var(--mut);margin-top:6px}
.embed img{width:64px;height:88px;object-fit:cover;border-radius:6px}
.delivery{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:12.5px}

/* ---------- system ---------- */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.box{padding:16px}
.box h3{margin:0 0 10px;font-size:15.5px;display:flex;align-items:center;gap:8px}
.hero{display:flex;gap:14px;align-items:center;padding:18px;flex-wrap:wrap}
.hero .ic{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:26px;flex:none}
.hero .ic.g{background:var(--okS)}.hero .ic.y{background:var(--warnS)}.hero .ic.r{background:var(--badS)}.hero .ic.n{background:var(--bg2)}
.hero .h{font-size:18px;font-weight:800}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin-top:12px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fact .k{font-size:12px;color:var(--mut)}.fact .v{font-weight:700;margin-top:2px}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.rows li:first-child{border-top:0}
.rows .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.rows time{font-size:12px;color:var(--mut);white-space:nowrap}

/* ---------- forms ---------- */
.f label{display:block;font-size:13px;color:var(--mut);margin:11px 0 4px}
.f input[type=text],.f input[type=url],.f input[type=password],.f input[type=number],.f input[type=time],.f select,.f textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card)}
.f textarea{min-height:70px;resize:vertical}
.f select.sel{width:auto;padding:6px 8px}
.f .row{display:flex;gap:10px}.f .row>*{flex:1;min-width:0}
.hint{font-size:12.5px;color:var(--mut);margin-top:5px}
.hint.ok{color:var(--ok)}.hint.bad{color:var(--bad)}.hint.warn{color:var(--warn)}
.sw{position:relative;width:44px;height:25px;flex:none;display:inline-block}
.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:transform .22s cubic-bezier(.3,1.6,.5,1);box-shadow:0 1px 3px #0004}
.sw input:checked+i{background:var(--ok)}.sw input:checked+i::after{transform:translateX(19px)}
.tchip{display:inline-flex;align-items:center;gap:4px;background:var(--priS);color:var(--pri);border-radius:99px;padding:4px 6px 4px 11px;font-weight:600;font-size:14px}
.tchip button{border:0;background:transparent;color:inherit;padding:0 4px;font-size:15px;line-height:1}
.line{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:7px 0}
/* ---------- ตั้งเวลาตรวจ ---------- */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:11px 10px;text-align:left;display:flex;flex-direction:column;gap:3px;position:relative;transition:transform .12s,border-color .15s,background .15s;color:var(--tx)}
.mode:active{transform:scale(.97)}
.mode .mi{font-size:21px;line-height:1}.mode .mt{display:flex;flex-direction:column;min-width:0}.mode b{font-size:14px}.mode .mt span{font-size:12px;color:var(--mut);line-height:1.35}
.mode[aria-pressed=true]{border-color:var(--pri);background:var(--priS);box-shadow:0 0 0 3px var(--priS)}
.mode .rec{position:absolute;top:7px;right:8px;font-size:10px;font-style:normal;background:var(--ok);color:#fff;border-radius:99px;padding:1px 7px;font-weight:700}
@media(max-width:520px){.modes{grid-template-columns:1fr}.mode{flex-direction:row;align-items:center;gap:12px;padding:10px 12px}.mode .rec{top:50%;transform:translateY(-50%);right:10px}}
.spb{margin-top:10px;padding:12px;border-radius:13px;background:var(--card);border:1px solid var(--line)}
.spb .seg{flex-wrap:wrap}
.chips.wrap{flex-wrap:wrap;overflow:visible;padding-bottom:0}
.chip.sug{margin-top:8px;white-space:normal;text-align:left;background:var(--warnS);border-color:transparent}
.cust{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--mut)}
.f .cust input{width:64px;padding:5px 8px}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:8px}
.addrow{align-items:center;flex-wrap:wrap}.f .addrow>input{flex:1 1 92px;min-width:0}.addrow>span{flex:none}.addrow>.btn{flex:0 0 auto}
.f label.chk{display:flex;gap:8px;align-items:flex-start;color:var(--tx);font-size:14px;margin:12px 0 0;cursor:pointer}
.chk input{margin-top:4px}
.sum{margin-top:12px;font-size:14px;padding:11px 12px;border-radius:13px;background:var(--bg2)}
.tl{position:relative;height:28px;border-radius:8px;background:var(--card);margin-top:8px;overflow:hidden;border:1px solid var(--line)}
.tl .w{position:absolute;top:0;bottom:0;background:var(--priS)}
.tl .k{position:absolute;top:6px;bottom:6px;width:2px;margin-left:-1px;background:var(--pri);border-radius:2px;opacity:.85}
.tl .nw{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--bad)}
.tll{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:2px}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:40;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s}
.sheet[hidden]{display:none}
.sheet .in{background:var(--bg);width:min(620px,100%);max-height:92vh;overflow:auto;border-radius:20px;position:relative;animation:up .28s cubic-bezier(.2,1.2,.4,1);box-shadow:0 20px 60px #0006;overscroll-behavior:contain}
.sheet .x{position:absolute;top:12px;right:12px;z-index:3;box-shadow:var(--sh)}
.pad{padding:18px}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(30px);opacity:0}}
@media(max-width:560px){.sheet{align-items:flex-end;padding:0}.sheet .in{border-radius:20px 20px 0 0;max-height:94vh;padding-bottom:env(safe-area-inset-bottom)}}
.dhead{position:relative;overflow:hidden;border-radius:20px 20px 0 0}
.dhead .blur{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(28px) saturate(1.3);opacity:.55}
.dhead .ct{position:relative;display:flex;gap:16px;padding:22px 18px 16px;align-items:flex-end}

<script>
"use strict";
/* ================================================================ utils */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"";
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(10)}catch(e){}};
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return""}};
const normU=u=>{try{const x=new URL(u);return(x.hostname.replace(/^www\./,"")+x.pathname.replace(/\/+$/,"")+x.search).toLowerCase()}catch(e){return String(u).toLowerCase()}};
const hash=s=>[...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const initial=n=>[...String(n||"").trim()].find(c=>/[\p{L}\p{N}]/u.test(c)&&!/[เแโใไ]/.test(c))||"?";
const num=l=>{const n=parseFloat(String(l??"").replace(/[^\d.]/g,""));return Number.isFinite(n)?n:null};
const T=iso=>{const t=Date.parse(iso||"");return Number.isFinite(t)?t:0};
const ROLE_TH={owner:"เจ้าของ",mod:"ผู้ดูแล",member:"สมาชิก"};
const svg=d=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+d+"</svg>";
const ICON={
  home:svg('<path d="M3.5 10.5 12 3.8l8.5 6.7V20a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1z"/>'),
  library:svg('<rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/>'),
  feed:svg('<path d="M6 16.5V11a6 6 0 1 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/>'),
  requests:svg('<path d="M3.5 6.5h17v11a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1z"/><path d="m3.8 7 8.2 6 8.2-6"/>'),
  system:svg('<circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/>')};
function ago(iso){const t=T(iso);if(!t)return"";const s=(Date.now()-t)/1e3;
  if(s<0){const m=-s/60;return m<60?"อีก "+Math.max(1,Math.round(m))+" นาที":"อีก "+Math.round(m/60)+" ชม."}
  if(s<45)return"เมื่อกี้";const m=s/60;if(m<60)return Math.round(m)+" นาทีที่แล้ว";const h=m/60;if(h<24)return Math.round(h)+" ชม.ที่แล้ว";
  const d=h/24;if(d<30)return Math.round(d)+" วันที่แล้ว";return new Date(t).toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"2-digit"})}
const fullTime=iso=>T(iso)?new Date(T(iso)).toLocaleString("th-TH",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"";
const dur=ms=>{const d=ms/864e5;if(d>=1.5)return"~"+Math.round(d)+" วัน";const h=ms/36e5;return h>=1?"~"+Math.round(h)+" ชม.":"~"+Math.max(1,Math.round(ms/6e4))+" นาที"};
/* ---------- ตารางเวลาตรวจ (สูตรเดียวกับ check.py / worker.js) ---------- */
const PEAK_DEFAULT={windows:["22:50-00:30","04:50-06:30"],every:5,off:360};
const SLOT_RE=/^([01]\d|2[0-3]):([0-5]\d)(?:-([01]\d|2[0-3]):([0-5]\d))?$/;
const clampI=(v,lo,hi,d)=>{const n=Math.trunc(+v);return Number.isFinite(n)&&v!==null&&v!==""?Math.max(lo,Math.min(hi,n)):d};
function schedOf(s){const sc=s&&s.sched;if(sc&&["peak","every","custom"].includes(sc.mode))return sc;if(s&&s.times&&s.times.length)return{mode:"custom",slots:s.times,off:1440};return{mode:"peak"}}
function planOf(s,st,cfg,nowMs){
  const sc=schedOf(s),c=cfg||{},pk=Object.assign({},PEAK_DEFAULT,c.peak||{});
  let tz=+(c.tz_offset??7),slots=[],step=0,base=360;
  if(sc.mode==="every")base=clampI(sc.min,10,10080,360);
  else if(sc.mode==="custom"){tz=+(sc.tz??tz);slots=sc.slots||[];step=clampI(sc.every,5,60,5);base=clampI(sc.off,10,10080,360)}
  else{slots=pk.windows||[];step=clampI(pk.every,5,60,5);base=clampI(pk.off,10,10080,360)}
  const wins=[],pts=[];
  for(const x of slots){const m=SLOT_RE.exec(String(x));if(!m)continue;const a=+m[1]*60+ +m[2];pts.push(a);if(m[3]!=null)wins.push([a,+m[3]*60+ +m[4]])}
  let dormant=false;
  if(s.autoslow!==false&&st){const last=Date.parse(st.updated||st.since||"");if(last&&nowMs-last>30*864e5){dormant=true;step=0;base=Math.max(base,720)}}
  return{tz,wins,pts,step:wins.length?step:0,base,dormant,mode:sc.mode};
}
function dueAt(p,triedMs,fails,nowMs){
  if(!triedMs)return true;
  const el=(nowMs-triedMs)/6e4;
  if(fails>=1&&fails<=3&&el>=4)return true;
  if(el>=p.base-2)return true;
  const L=Math.floor(nowMs/6e4+p.tz*60),mod=((L%1440)+1440)%1440;
  if(p.step&&el>=p.step-1.5&&p.wins.some(([a,b])=>a<=b?mod>=a&&mod<=b:mod>=a||mod<=b))return true;
  for(const pt of p.pts)if(triedMs<(L-(((mod-pt)%1440)+1440)%1440-p.tz*60)*6e4)return true;

  if(!canSync())return openAccount();
  if(e.ios&&!e.standalone)return openIosGuide();
  if(!e.ok)return toast("เบราว์เซอร์นี้ยังไม่รองรับแจ้งเตือน ลองใช้ Chrome","bad");
  await busy(btn,async()=>{
    const perm=await Notification.requestPermission();
    if(perm!=="granted")throw new Error(perm==="denied"?"เครื่องนี้ปิดสิทธิ์แจ้งเตือนของเว็บไว้ — เปิดได้ในตั้งค่าเบราว์เซอร์/ตั้งค่าโทรศัพท์":"ยังไม่ได้กดอนุญาตแจ้งเตือน");

    let sub=await reg.pushManager.getSubscription();
    if(sub&&sub.options&&sub.options.applicationServerKey&&pb64(sub.options.applicationServerKey)!==PUSH.key){await sub.unsubscribe();sub=null}
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:unpb64(PUSH.key)});

    setTimeout(()=>runPushTest(null,sub.endpoint),400);
  });
}

function behind(id){
  const st=ST(id);if(st.label==null||R[id]==null)return 0;
  const a=num(st.label),b=num(R[id]);

/** เรื่องที่ถึงเวลาตรวจมาเกิน 30 นาทีแล้วแต่ยังไม่ถูกตรวจ = ระบบสั่งตรวจไม่ทำงาน */
function overdue(){
  const now=Date.now(),out=[];
  for(const s of D.series){
    if(s.enabled===false)continue;const st=ST(s.id),tr=T(st.tried);
    if(!tr||T(st.blocked_until)>now)continue;
    const p=planOf(s,st,D.config,now);
    for(let t=Math.ceil(tr/TICK)*TICK;t<now-30*6e4;t+=TICK)if(dueAt(p,tr,+st.fails||0,t)){out.push(s);break}
  }
  return out;
}

async function doLogin(btn){
  const name=$("#lName").value.trim(),password=$("#lPw").value;
  if(!name||!password)return toast("กรอกชื่อและรหัสผ่าน","bad");
  await busy(btn,async()=>{
    const r=await api("/api/login",{method:"POST",body:{name,password}});
    S=r;LS.set("mw_session",S);closeSheet();USERS=AUDIT=REQS=null;loadR();initRead();pullRead();loadPush();

  });
}

/* ================================================================ actions */
function arm(btn,label,fn){
  if(btn.classList.contains("armed")){clearTimeout(btn._t);btn.classList.remove("armed");btn.textContent=btn._orig;return fn()}
  btn._orig=btn.textContent;btn.classList.add("armed");btn.textContent=label;buzz();
  btn._t=setTimeout(()=>{btn.classList.remove("armed");btn.textContent=btn._orig},3200);
}
async function checkOne(btn,id){
  const s=SER(id);if(!s)return;
  await busy(btn,async()=>{
    const before=ST(id).label;const r=await api("/api/check",{method:"POST",body:{only:id}});
    toast("สั่งตรวจ “"+s.name+"” แล้ว รอประมาณ 1 นาที…");
    const c=await waitRun(r.since);await loadData();
    const m=runMsg(c);if(m)return toast(m[0],m[1]);
    const st=ST(id);
    if(st.error)toast("ตรวจ “"+s.name+"” ไม่ได้: "+st.error,"bad",9000);
    else if(before&&st.label!==before)toast("🔔 “"+s.name+"” ตอน "+before+" → "+st.label+" (ส่ง Discord แล้ว)","ok",8000);
    else toast("“"+s.name+"” ยังเป็นตอน "+(st.label||"?")+" — ยังไม่มีตอนใหม่","info");
  });
}

  pkadd:()=>{const a=$("#pkA").value,b=$("#pkB").value;if(toMin(a)==null||toMin(b)==null)return toast("เลือกเวลาเริ่มและสิ้นสุด","bad");if(a===b)return toast("เวลาเริ่มกับสิ้นสุดต้องต่างกัน","bad");
    const w=a+"-"+b;if(UI.pk.windows.includes(w))return;if([...UI.pk.windows,w].reduce((x,y)=>x+winLen(y),0)>480)return toast("ช่วงหลักรวมกันได้ไม่เกิน 8 ชม./วัน","bad");
    UI.pk.windows=[...UI.pk.windows,w].sort();UI.clearForm=true;buzz();render()},
  pkev:el=>{UI.pk.every=+el.dataset.v;buzz();render()},
  pkoff:el=>{UI.pk.off=+el.dataset.v;buzz();render()},
  resetpeak:()=>{UI.pk=JSON.parse(JSON.stringify(PEAK_DEFAULT));buzz();render();toast("กด “บันทึก” เพื่อใช้ค่าเริ่มต้น","info",2500)},
  savepeak:el=>busy(el,async()=>{const r=await api("/api/config",{method:"PUT",body:{peak:UI.pk}});D.config=r.config;UI.pk=null;AUDIT=null;render();toast("บันทึกช่วงออกตอนหลักแล้ว — ใช้กับทุกเรื่องโหมด ⭐ ทันที","ok")}),
  savealert:el=>busy(el,async()=>{const body={alert:{enabled:$("#alOn").checked,discord:$("#alId").value.trim()}};const r=await api("/api/config",{method:"PUT",body});D.config=r.config;CFG=Object.assign(CFG||{},body);AUDIT=null;render();
    toast(body.alert.enabled&&body.alert.discord?"บอทจะแท็กคุณเมื่อระบบมีปัญหา 🚨":"ปิดแจ้งเตือนเจ้าของแล้ว","ok")}),
  spmode:el=>{const k=PK[el.dataset.t];k.mode=el.dataset.v;spRender(el.dataset.t)},
  spmin:el=>{PK[el.dataset.t].min=+el.dataset.v;const hr=$("#"+el.dataset.t+"Hr");if(hr)hr.value="";spRender(el.dataset.t)},
  spoff:el=>{PK[el.dataset.t].off=+el.dataset.v;spRender(el.dataset.t)},
  sptz:el=>{const k=PK[el.dataset.t],old=k.tz,nw=+el.dataset.v,sh=(nw-old)*60;
    // ย้ายเวลาที่ตั้งไว้ให้เป็นเวลาเดิมตามนาฬิกาไทย
    k.slots=k.slots.map(x=>{const m=SLOT_RE.exec(x);if(!m)return x;const a=hm(toMin(m[1]+":"+m[2])+sh);return m[3]!=null?a+"-"+hm(toMin(m[3]+":"+m[4])+sh):a});k.tz=nw;spRender(el.dataset.t)},
  spdel:el=>{const k=PK[el.dataset.t];k.slots=k.slots.filter(x=>x!==el.dataset.v);spRender(el.dataset.t)},
  spadd:el=>{const id=el.dataset.t,k=PK[id],v=$("#"+id+"Rel").value,t=toMin(v);if(t==null){$("#"+id+"Rel").focus();return toast("เลือกเวลาที่ตอนใหม่ออกก่อน","bad")}
    spPush(id,el.dataset.v==="win"?hm(t-10)+"-"+hm(t+60):hm(t))},
  spsug:el=>{const id=el.dataset.t,k=PK[id],t=toMin(k.sug.at)+(k.tz-TH)*60;spPush(id,hm(t-10)+"-"+hm(t+60))},
  subsave:el=>busy(el,async()=>{const n=el.dataset.n,inp=document.querySelector('[data-subid="'+CSS.escape(n)+'"]');
    const r=await api("/api/subs/"+encodeURIComponent(n),{method:"PUT",body:{discord:inp.value.trim()}});SUBS.users[n]=r.user;toast("บันทึก Discord ID ของ "+n+" แล้ว","ok");AUDIT=null}),
  subdel:el=>arm(el,"ยืนยันลบ?",()=>busy(el,async()=>{const n=el.dataset.n;await api("/api/subs/"+encodeURIComponent(n),{method:"DELETE"});delete SUBS.users[n];AUDIT=null;await loadData();toast("ลบ "+n+" ออกจากรายชื่อแท็กแล้ว","ok")})),
  subadd:el=>busy(el,async()=>{const n=$("#sbName").value.trim(),id=$("#sbId").value.trim();if(!n)return toast("ใส่ชื่อ","bad");
    if(SUBS.users[n])return toast("มีชื่อนี้แล้ว แก้ ID ในรายการได้เลย","bad");
    const r=await api("/api/subs/"+encodeURIComponent(n),{method:"PUT",body:{discord:id,series:[]}});SUBS.users[n]=r.user;AUDIT=null;UI.clearForm=true;render();toast("เพิ่ม "+n+" แล้ว — เลือกเรื่องที่ให้แท็กได้ในหน้ารายละเอียดเรื่อง","ok",6000)}),
  subtoggle:async el=>{const n=el.dataset.n,sid=el.dataset.sid,u=SUBS.users[n]||{series:[]},on=el.checked;
    const next=on?[...new Set([...(u.series||[]),sid])]:(u.series||[]).filter(x=>x!==sid);
    try{const r=await api("/api/subs/"+encodeURIComponent(n),{method:"PUT",body:{series:next}});SUBS.users[n]=r.user;
      const f=D.followers[sid]||[];D.followers[sid]=on?[...f.filter(x=>x!==n),n]:f.filter(x=>x!==n);if(S&&n===S.user.name&&ME)ME.series=next;
      toast((on?"จะแท็ก ":"เลิกแท็ก ")+n+" ในเรื่องนี้","ok",2500);render();openDetail(sid,true)}catch(e){el.checked=!on;toast(e.message,"bad")}},
  adduser:el=>busy(el,async()=>{const name=$("#nuName").value.trim(),role=$("#nuRole").value,password=$("#nuPw").value;
    await api("/api/users",{method:"POST",body:{name,role,password}});
    openSheet('<div class="pad"><h2 style="margin:0">สร้างบัญชีแล้ว 🎉</h2><p class="mut small">ส่งข้อความนี้ให้ '+esc(name)+' ได้เลย</p><div class="card box" style="white-space:pre-wrap;user-select:all" id="cred">'+esc("เข้า "+location.origin+location.pathname+"\nชื่อผู้ใช้: "+name+"\nรหัสผ่าน: "+password)+'</div><div class="acts"><button class="btn" data-act="copy" data-src="cred">คัดลอก</button><button class="btn g" data-act="close">ปิด</button></div></div>',null,"cred");
    USERS=null;AUDIT=null;UI.clearForm=true;render()}),
  resetpw:el=>{const u=el.dataset.u,pw=randPw();
    arm(el,"ยืนยันรีเซ็ต?",()=>busy(el,async()=>{await api("/api/users/"+encodeURIComponent(u),{method:"PATCH",body:{password:pw}});AUDIT=null;
      openSheet('<div class="pad"><h2 style="margin:0">รหัสใหม่ของ '+esc(u)+'</h2><p class="mut small">ส่งให้เจ้าของบัญชี (แสดงครั้งเดียว) เครื่องที่ล็อกอินไว้จะถูกออกจากระบบ</p><div class="card box" id="cred" style="font:600 22px ui-monospace,monospace;text-align:center;letter-spacing:2px;user-select:all">'+esc(pw)+'</div><div class="acts"><button class="btn" data-act="copy" data-src="cred">คัดลอก</button><button class="btn g" data-act="close">ปิด</button></div></div>',null,"cred")}))},
  copy:el=>{const t=($("#"+el.dataset.src)||{}).textContent||"";if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast("คัดลอกแล้ว","ok",1500),()=>toast("คัดลอกไม่ได้ ให้กดค้างที่ข้อความแล้วคัดลอกเอง","bad"))},
  deluser:el=>arm(el,"ยืนยันลบ?",()=>busy(el,async()=>{await api("/api/users/"+encodeURIComponent(el.dataset.u),{method:"DELETE"});USERS=USERS.filter(x=>x.name!==el.dataset.u);AUDIT=null;render();toast("ลบผู้ใช้แล้ว","ok")})),
};
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el||el.tagName==="SELECT"||el.tagName==="INPUT")return;
  const fn=ACT[el.dataset.act];if(fn)fn(el,e);
});
document.addEventListener("change",async e=>{
  const el=e.target;
  if(el.id==="sort"){P.sort=el.value;savePrefs();render();return}
  if(el.dataset.act==="notify")return ACT.notify(el);
  if(el.dataset.act==="subtoggle")return ACT.subtoggle(el);
  if(el.dataset.act==="pushsw"){el.checked=!el.checked;return el.checked?disablePush(el):enablePush(el)}
  if(el.dataset.act==="pushtoggle"&&el.type==="checkbox"){return togglePushSeries(el.dataset.id)}
  if(el.dataset.act==="spslow"){PK[el.dataset.t].autoslow=el.checked;return spRender(el.dataset.t)}
  if(el.id&&/Hr$/.test(el.id)&&PK[el.id.slice(0,-2)]){const id=el.id.slice(0,-2),v=Math.round(+el.value*60);if(v>=60&&v<=10080){PK[id].min=v;spRender(id)}return}
  if(el.dataset.act==="role"){const u=el.dataset.u;try{await api("/api/users/"+encodeURIComponent(u),{method:"PATCH",body:{role:el.value}});toast("เปลี่ยนยศ "+u+" เป็น"+(el.value==="mod"?"ผู้ดูแล":"สมาชิก")+"แล้ว","ok");AUDIT=null;USERS=null;render()}catch(x){toast(x.message,"bad");USERS=null;render()}}
});
document.addEventListener("input",e=>{if(e.target.id&&/Rel$/.test(e.target.id)&&PK[e.target.id.slice(0,-3)])PK[e.target.id.slice(0,-3)].rel=e.target.value;if(e.target.id==="q"){UI.q=e.target.value;const pos=e.target.selectionStart;render();const q=$("#q");if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(x){}}}});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!$("#sheet").hidden)closeSheet();
  if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&$("#q")){e.preventDefault();$("#q").focus()}
});
$("#sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeSheet()});
$("#sheet").addEventListener("input",e=>{if(e.target.matches("input,textarea,select")&&e.target.type!=="checkbox")UI.sheetDirty=true});
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();UI.installEvt=e});

/* ================================================================ start */
(async()=>{
  render();
  if(!API){const c=await staticJson("config.json",{});if(c&&c.worker_url)API=String(c.worker_url).trim().replace(/\/+$/,"")}
  loadR();pullRead();
  await loadData();loadStatus();loadMe();loadPush();setTimeout(checkVersion,4000);
  const openId=new URLSearchParams(location.search).get("open");   // กดจากแจ้งเตือน → เปิดเรื่องนั้น
  if(openId){history.replaceState(null,"",location.pathname);if(SER(openId))openDetail(openId)}
  if(isMod())loadReqs();
  // ประหยัดโควตา Cloudflare: ดึงข้อมูลทุก 2 นาที / สถานะทุก 5 นาที เฉพาะตอนเปิดหน้านี้อยู่ (แท็บที่ซ่อนไว้ไม่ดึง)
  setInterval(()=>{if(!document.hidden&&!document.querySelector(".btn.busy")&&Date.now()-UI.lastLoad>100000)loadData(true)},120000);
  setInterval(()=>{if(!document.hidden&&(P.tab==="system"||Date.now()-(UI.lastStatus||0)>600000))loadStatus()},300000);
  setInterval(()=>{if(!document.hidden)renderHealth()},30000);
  setInterval(()=>{if(!document.hidden&&Date.now()-RSYNC.last>240000)pullRead()},300000);
  setInterval(()=>{if(!document.hidden)checkVersion()},30*6e4);
  document.addEventListener("visibilitychange",()=>{if(document.hidden){if(RSYNC.dirty.size){clearTimeout(RSYNC.timer);pushRead()}return}if(Date.now()-RSYNC.last>60000)pullRead();if(!document.hidden){if(Date.now()-UI.lastLoad>60000)loadData(true);if(Date.now()-(UI.lastStatus||0)>180000)loadStatus()}});
  if("serviceWorker"in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){
    navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{});   // บังคับเช็ก sw.js ตัวใหม่ทุกครั้งที่เปิด
    navigator.serviceWorker.addEventListener("message",e=>{try{const id=new URL(e.data.open).searchParams.get("open");if(id&&SER(id))openDetail(id)}catch(x){}});
  }
})();
</script>
</body>
